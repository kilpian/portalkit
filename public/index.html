<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>portalkit — client portals for freelancers</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #FDFAF5;
        color: #1a1a1a;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }
      .logo { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 1.5rem; }
      h1 { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 700; letter-spacing: -0.04em; line-height: 1.1; text-align: center; max-width: 700px; margin-bottom: 1rem; }
      p { font-size: 1.125rem; color: #555; text-align: center; max-width: 480px; margin-bottom: 2.5rem; line-height: 1.6; }
      .actions { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
      a.btn {
        display: inline-block;
        padding: 0.75rem 1.75rem;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        text-decoration: none;
        transition: opacity 0.15s;
      }
      a.btn:hover { opacity: 0.85; }
      a.btn-primary { background: #1a1a1a; color: #fff; }
      a.btn-secondary { background: transparent; color: #1a1a1a; border: 1.5px solid #1a1a1a; }
    </style>
  </head>
  <body>
    <div class="logo">portalkit</div>
    <h1>Beautiful client portals, built for freelancers</h1>
    <p>Share files, send contracts, collect signatures, and get paid — all in one branded space your clients will love.</p>
    <div class="actions">
      <a href="/signup" class="btn btn-primary">Get started free</a>
      <a href="/signin" class="btn btn-secondary">Sign in</a>
    </div>
  </body>
</html>
